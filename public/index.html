<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JWOC Events Hub</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="page">
      <div class="card">
        <h1>JWOC Events Hub</h1>
        <p class="subtitle">
          Manage event leads captured from JW Sales Hub. Create events, view
          submissions, and export to CSV.
        </p>

        <div class="api-key-panel">
          <label for="apiKey">API Key (required to create events)</label>
          <input
            id="apiKey"
            type="password"
            placeholder="Enter your API key"
            autocomplete="off"
          />
          <div class="actions">
            <button type="button" id="saveApiKeyButton">Save API Key</button>
          </div>
        </div>

        <h2>Create Event</h2>
        <form id="createEventForm">
          <label for="eventName">Event Name</label>
          <input
            id="eventName"
            name="name"
            type="text"
            required
            placeholder="Toronto Home Show 2026"
          />

          <label for="eventDate">Event Date</label>
          <input id="eventDate" name="date" type="date" required />

          <label for="eventId">Event ID (optional)</label>
          <input
            id="eventId"
            name="id"
            type="text"
            placeholder="toronto-home-show-2026"
          />

          <div class="actions">
            <button type="submit" id="createEventButton">Create Event</button>
          </div>
        </form>
        <div id="formMessage" class="message" style="display: none"></div>

        <h2>Events</h2>
        <ul id="eventsList" class="event-list"></ul>
        <div id="eventsEmpty" class="empty-state" style="display: none">
          No events yet. Create your first event above.
        </div>
      </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
      const apiKeyInput = document.getElementById("apiKey");
      const createEventForm = document.getElementById("createEventForm");
      const eventsList = document.getElementById("eventsList");
      const eventsEmpty = document.getElementById("eventsEmpty");

      apiKeyInput.value = getApiKey();

      document
        .getElementById("saveApiKeyButton")
        .addEventListener("click", () => {
          saveApiKey(apiKeyInput.value);
          showMessage(
            "formMessage",
            "API key saved for this session.",
            "success",
          );
        });

      async function loadEvents() {
        try {
          const data = await apiRequest("/api/events");
          const events = data.events || [];

          eventsList.innerHTML = "";
          eventsEmpty.style.display = events.length ? "none" : "block";

          events.forEach((event) => {
            const item = document.createElement("li");
            item.innerHTML = `
              <a href="/event.html?id=${encodeURIComponent(event.id)}">
                <strong>${event.name}</strong>
                <div class="event-meta">
                  ${formatDate(event.date)} ·
                  <span class="badge">${event.leadCount || 0} leads</span>
                </div>
              </a>
            `;
            eventsList.appendChild(item);
          });
        } catch (error) {
          showMessage("formMessage", error.message, "error");
        }
      }

      createEventForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const apiKey = getApiKey();
        if (!apiKey) {
          showMessage(
            "formMessage",
            "Save your API key before creating an event.",
            "error",
          );
          return;
        }

        const formData = new FormData(createEventForm);
        const payload = {
          name: formData.get("name"),
          date: formData.get("date"),
        };

        const customId = String(formData.get("id") || "").trim();
        if (customId) {
          payload.id = customId;
        }

        const button = document.getElementById("createEventButton");
        button.disabled = true;

        try {
          await apiRequest("/api/events", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${apiKey}`,
            },
            body: JSON.stringify(payload),
          });

          createEventForm.reset();
          showMessage("formMessage", "Event created successfully.", "success");
          await loadEvents();
        } catch (error) {
          showMessage("formMessage", error.message, "error");
        } finally {
          button.disabled = false;
        }
      });

      loadEvents();
    </script>
  </body>
</html>
