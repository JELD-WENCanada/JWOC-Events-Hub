<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Leads — JWOC Events Hub</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="page">
      <div class="card">
        <div class="header-row">
          <div>
            <a href="/" class="button secondary">← Back to Events</a>
            <h1 id="eventTitle">Event Leads</h1>
            <p id="eventMeta" class="subtitle"></p>
          </div>
          <div class="actions">
            <a id="exportCsvButton" class="button" href="#">Export CSV</a>
            <button type="button" id="exportJsonButton" class="secondary">
              Download JSON
            </button>
          </div>
        </div>

        <div id="leadsTableWrap"></div>
        <div id="leadsEmpty" class="empty-state" style="display: none">
          No leads captured yet for this event.
        </div>
        <div id="pageMessage" class="message error" style="display: none"></div>
      </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
      const params = new URLSearchParams(window.location.search);
      const eventId = params.get("id");

      const eventTitle = document.getElementById("eventTitle");
      const eventMeta = document.getElementById("eventMeta");
      const leadsTableWrap = document.getElementById("leadsTableWrap");
      const leadsEmpty = document.getElementById("leadsEmpty");
      const exportCsvButton = document.getElementById("exportCsvButton");
      const exportJsonButton = document.getElementById("exportJsonButton");

      if (!eventId) {
        showMessage("pageMessage", "Missing event ID in URL.", "error");
      } else {
        exportCsvButton.href = `/api/events/${encodeURIComponent(eventId)}/export`;
        loadEvent();
      }

      async function loadEvent() {
        try {
          const event = await apiRequest(
            `/api/events/${encodeURIComponent(eventId)}`,
          );

          eventTitle.textContent = event.name;
          eventMeta.textContent = `${formatDate(event.date)} · Event ID: ${event.id} · ${(event.leads || []).length} leads`;

          const leads = event.leads || [];
          leadsEmpty.style.display = leads.length ? "none" : "block";

          if (!leads.length) {
            leadsTableWrap.innerHTML = "";
            return;
          }

          const rows = leads
            .map((lead) => {
              const products = Array.isArray(lead.productsOfInterest)
                ? lead.productsOfInterest.join(", ")
                : "";
              return `
                <tr>
                  <td>${lead.firstName || ""}</td>
                  <td>${lead.lastName || ""}</td>
                  <td>${lead.email || ""}</td>
                  <td>${lead.phone || ""}</td>
                  <td>${lead.company || ""}</td>
                  <td>${products}</td>
                  <td>${lead.capturedBy || ""}</td>
                  <td>${formatDateTime(lead.capturedAt)}</td>
                </tr>
              `;
            })
            .join("");

          leadsTableWrap.innerHTML = `
            <table>
              <thead>
                <tr>
                  <th>First Name</th>
                  <th>Last Name</th>
                  <th>Email</th>
                  <th>Phone</th>
                  <th>Company</th>
                  <th>Products</th>
                  <th>Captured By</th>
                  <th>Captured At</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          `;

          exportJsonButton.addEventListener("click", () => {
            const blob = new Blob([JSON.stringify(event, null, 2)], {
              type: "application/json",
            });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = `${event.id}.json`;
            link.click();
            URL.revokeObjectURL(url);
          });
        } catch (error) {
          showMessage("pageMessage", error.message, "error");
        }
      }
    </script>
  </body>
</html>
