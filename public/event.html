<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Leads — JWOC Events Hub</title>
    <link rel="stylesheet" href="/css/style.css?v=15" />
  </head>
  <body>
    <header class="app-header">
      <div class="app-header-inner">
        <a href="/" class="app-header-brand app-header-brand-link">
          <img
            src="/images/jw-logo.png"
            alt=""
            class="app-header-logo"
            width="28"
            height="28"
          />
          <h1 class="nav-title">Events Hub</h1>
        </a>
        <div class="app-header-actions">
          <a
            href="/profile.html"
            id="userPill"
            class="user-pill user-pill-link"
            hidden
          >
            <span id="userAvatar" class="user-avatar"></span>
            <span class="user-pill-text">
              <span
                id="userDisplayName"
                class="user-display-name"
                hidden
              ></span>
              <span id="userEmail" class="user-email"></span>
            </span>
          </a>
          <a href="/" class="btn btn-ghost">All events</a>
        </div>
      </div>
    </header>

    <main class="app-content">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="/">Events</a>
        <span class="breadcrumb-sep">/</span>
        <span id="breadcrumbCurrent">Event</span>
      </nav>

      <section class="panel">
        <div class="panel-body">
          <div class="detail-head">
            <div>
              <h2 id="eventTitle" class="detail-title">Event</h2>
              <p id="eventMeta" class="subtitle"></p>
            </div>
            <div class="actions">
              <button
                type="button"
                id="editEventButton"
                class="btn btn-ghost"
                hidden
              >
                Edit
              </button>
              <button
                type="button"
                id="archiveEventButton"
                class="btn btn-ghost"
                hidden
              >
                Archive
              </button>
              <button
                type="button"
                id="deleteEventButton"
                class="btn btn-ghost btn-danger-ghost"
                hidden
              >
                Delete event
              </button>
              <div class="btn-group">
                <a id="exportCsvButton" class="btn btn-secondary" href="#"
                  >CSV</a
                >
                <button
                  type="button"
                  id="exportJsonButton"
                  class="btn btn-secondary"
                >
                  JSON
                </button>
              </div>
            </div>
          </div>

          <section
            id="eventLeaderboardSection"
            class="leaderboard-inline"
            hidden
          >
            <h3 class="leaderboard-inline-title">Rep leaderboard</h3>
            <div id="eventLeaderboard"></div>
          </section>

          <form id="leadFilters" class="filter-bar">
            <input
              id="searchFilter"
              name="search"
              class="filter-search"
              type="search"
              placeholder="Search contacts…"
            />
            <div class="filter-chips">
              <label class="filter-chip">
                <input id="hasPhoneFilter" name="hasPhone" type="checkbox" />
                Has phone
              </label>
              <label class="filter-chip">
                <input id="hasEmailFilter" name="hasEmail" type="checkbox" />
                Has email
              </label>
              <label class="filter-chip">
                <input
                  id="hasCompanyFilter"
                  name="hasCompany"
                  type="checkbox"
                />
                Has company
              </label>
              <label class="filter-chip">
                <input
                  id="duplicatesOnlyFilter"
                  name="duplicatesOnly"
                  type="checkbox"
                />
                Duplicates
              </label>
            </div>
            <p id="filterSummary" class="filter-summary"></p>
          </form>

          <div id="leadsBulkActions" class="bulk-actions" hidden>
            <span id="leadsSelectionSummary" class="bulk-actions-summary"
              >0 selected</span
            >
            <button
              type="button"
              id="deleteSelectedLeadsButton"
              class="btn btn-ghost btn-small btn-danger-ghost"
              disabled
            >
              Delete selected
            </button>
          </div>

          <div id="leadsTableWrap" class="table-wrap"></div>
          <div id="leadsPagination" class="pagination" hidden></div>
          <div id="leadsEmpty" class="empty-state" hidden>
            No leads captured yet for this event.
          </div>
          <div id="leadsFilteredEmpty" class="empty-state" hidden>
            No contacts match the current filters.
          </div>
          <div id="pageMessage" class="message error" hidden></div>
        </div>
      </section>
    </main>

    <dialog id="editEventDialog" class="modal">
      <form id="editEventForm" method="dialog" class="modal-card">
        <h2 class="modal-title">Edit event</h2>
        <div class="field">
          <label class="field-label" for="editEventName">Name</label>
          <input id="editEventName" name="name" type="text" required />
        </div>
        <div class="field">
          <label class="field-label" for="editEventDate">Date</label>
          <input id="editEventDate" name="date" type="date" required />
        </div>
        <div id="editEventMessage" class="message" hidden></div>
        <div class="modal-actions">
          <button type="button" id="editEventCancel" class="btn btn-ghost">
            Cancel
          </button>
          <button type="submit" id="editEventSave" class="btn btn-primary">
            Save changes
          </button>
        </div>
      </form>
    </dialog>

    <dialog id="editLeadDialog" class="modal">
      <form id="editLeadForm" method="dialog" class="modal-card">
        <h2 class="modal-title">Edit contact</h2>
        <div class="field-grid">
          <div class="field">
            <label class="field-label" for="editLeadFirstName"
              >First name</label
            >
            <input
              id="editLeadFirstName"
              name="firstName"
              type="text"
              required
            />
          </div>
          <div class="field">
            <label class="field-label" for="editLeadLastName">Last name</label>
            <input id="editLeadLastName" name="lastName" type="text" required />
          </div>
        </div>
        <div class="field">
          <label class="field-label" for="editLeadEmail">Email</label>
          <input
            id="editLeadEmail"
            name="email"
            type="email"
            autocomplete="email"
          />
        </div>
        <div class="field">
          <label class="field-label" for="editLeadPhone">Phone</label>
          <input
            id="editLeadPhone"
            name="phone"
            type="tel"
            autocomplete="tel"
          />
        </div>
        <div class="field">
          <label class="field-label" for="editLeadCompany">Company</label>
          <input id="editLeadCompany" name="company" type="text" />
        </div>
        <div class="field">
          <label class="field-label" for="editLeadCapturedBy"
            >Captured by</label
          >
          <input id="editLeadCapturedBy" name="capturedBy" type="text" />
        </div>
        <div class="field">
          <label class="field-label" for="editLeadProducts"
            >Products of interest
            <span class="hint">comma-separated</span></label
          >
          <input id="editLeadProducts" name="productsOfInterest" type="text" />
        </div>
        <div class="field">
          <label class="field-label" for="editLeadNotes">Notes</label>
          <textarea id="editLeadNotes" name="notes" rows="3"></textarea>
        </div>
        <div id="editLeadMessage" class="message" hidden></div>
        <div class="modal-actions">
          <button type="button" id="editLeadCancel" class="btn btn-ghost">
            Cancel
          </button>
          <button type="submit" id="editLeadSave" class="btn btn-primary">
            Save changes
          </button>
        </div>
      </form>
    </dialog>

    <script src="/js/app.js?v=15"></script>
    <script>
      const params = new URLSearchParams(window.location.search);
      const eventId = params.get("id");

      const breadcrumbCurrent = document.getElementById("breadcrumbCurrent");
      const eventTitle = document.getElementById("eventTitle");
      const eventMeta = document.getElementById("eventMeta");
      const leadsTableWrap = document.getElementById("leadsTableWrap");
      const leadsEmpty = document.getElementById("leadsEmpty");
      const leadsFilteredEmpty = document.getElementById("leadsFilteredEmpty");
      const exportCsvButton = document.getElementById("exportCsvButton");
      const exportJsonButton = document.getElementById("exportJsonButton");
      const leadFilters = document.getElementById("leadFilters");
      const filterSummary = document.getElementById("filterSummary");
      const leadsPagination = document.getElementById("leadsPagination");
      const eventLeaderboardSection = document.getElementById(
        "eventLeaderboardSection",
      );
      const eventLeaderboard = document.getElementById("eventLeaderboard");
      const editEventButton = document.getElementById("editEventButton");
      const archiveEventButton = document.getElementById("archiveEventButton");
      const deleteEventButton = document.getElementById("deleteEventButton");
      const editEventDialog = document.getElementById("editEventDialog");
      const editEventForm = document.getElementById("editEventForm");
      const editEventCancel = document.getElementById("editEventCancel");
      const editLeadDialog = document.getElementById("editLeadDialog");
      const editLeadForm = document.getElementById("editLeadForm");
      const editLeadCancel = document.getElementById("editLeadCancel");
      const leadsBulkActions = document.getElementById("leadsBulkActions");
      const leadsSelectionSummary = document.getElementById(
        "leadsSelectionSummary",
      );
      const deleteSelectedLeadsButton = document.getElementById(
        "deleteSelectedLeadsButton",
      );

      let eventData = null;
      let isAdmin = false;
      let leadsPage = 1;
      let editingLeadId = null;
      const selectedLeadIds = new Set();

      if (!eventId) {
        showMessage("pageMessage", "Missing event ID in URL.", "error");
      } else {
        leadFilters.addEventListener("input", () => {
          leadsPage = 1;
          renderLeads();
        });
        leadFilters.addEventListener("change", () => {
          leadsPage = 1;
          renderLeads();
        });
        exportJsonButton.addEventListener("click", exportFilteredJson);
        editEventButton.addEventListener("click", openEditDialog);
        archiveEventButton.addEventListener("click", toggleArchive);
        deleteEventButton.addEventListener("click", confirmDeleteEvent);
        editEventCancel.addEventListener("click", closeEditDialog);
        editEventForm.addEventListener("submit", saveEventEdits);
        editLeadCancel.addEventListener("click", closeEditLeadDialog);
        editLeadForm.addEventListener("submit", saveLeadEdits);
        deleteSelectedLeadsButton.addEventListener(
          "click",
          confirmDeleteSelectedLeads,
        );
        initPage();
      }

      async function initPage() {
        const userPillElements = {
          pill: document.getElementById("userPill"),
          avatar: document.getElementById("userAvatar"),
          displayName: document.getElementById("userDisplayName"),
          email: document.getElementById("userEmail"),
        };

        try {
          const session = await getAdminSession();
          isAdmin = session.authenticated;
          editEventButton.hidden = !isAdmin;
          archiveEventButton.hidden = !isAdmin;
          deleteEventButton.hidden = !isAdmin;

          if (isAdmin && session.email) {
            applyUserPillState(userPillElements, session.email, null);
            try {
              const profilePage = await fetchAdminProfile();
              applyUserPillState(
                userPillElements,
                session.email,
                profilePage.profile || null,
              );
            } catch {
              applyUserPillState(userPillElements, session.email, null);
            }
          } else {
            applyUserPillState(userPillElements, "", null);
          }
        } catch {
          isAdmin = false;
          applyUserPillState(
            {
              pill: document.getElementById("userPill"),
              avatar: document.getElementById("userAvatar"),
              displayName: document.getElementById("userDisplayName"),
              email: document.getElementById("userEmail"),
            },
            "",
            null,
          );
        }

        await loadEvent();
      }

      async function loadEvent() {
        try {
          eventData = await apiRequest(
            `/api/events/${encodeURIComponent(eventId)}`,
          );

          eventTitle.textContent = eventData.name;
          breadcrumbCurrent.textContent = eventData.name;
          document.title = `${eventData.name} — JWOC Events Hub`;
          updateAdminActions();
          renderLeaderboard();
          renderLeads();
        } catch (error) {
          showMessage("pageMessage", error.message, "error");
        }
      }

      function updateAdminActions() {
        if (!isAdmin || !eventData) {
          return;
        }

        archiveEventButton.textContent = isEventArchived(eventData)
          ? "Restore"
          : "Archive";
        deleteEventButton.hidden = !isAdmin || !isEventArchived(eventData);
      }

      async function confirmDeleteEvent() {
        if (!eventData || !isEventArchived(eventData)) {
          return;
        }

        const leadCount = (eventData.leads || []).length;
        const confirmed = window.confirm(
          `Delete "${eventData.name}" and all ${leadCount} leads? This cannot be undone.`,
        );
        if (!confirmed) {
          return;
        }

        const defaultLabel = deleteEventButton.textContent;
        deleteEventButton.disabled = true;
        deleteEventButton.textContent = "Deleting…";

        try {
          await deleteEvent(eventId);
          window.location.href = "/";
        } catch (error) {
          showMessage("pageMessage", error.message, "error");
          deleteEventButton.disabled = false;
          deleteEventButton.textContent = defaultLabel;
        }
      }

      function renderLeaderboard() {
        const leaderboard = buildRepLeaderboard(eventData?.leads || []);
        eventLeaderboardSection.hidden = leaderboard.length === 0;
        eventLeaderboard.innerHTML = renderLeaderboardHtml(leaderboard, {
          emptyMessage: "No leads captured yet for this event.",
        });
      }

      function openEditDialog() {
        document.getElementById("editEventName").value = eventData.name;
        document.getElementById("editEventDate").value = eventData.date;
        showMessage("editEventMessage", "", "success");
        editEventDialog.showModal();
      }

      function closeEditDialog() {
        editEventDialog.close();
      }

      function openEditLeadDialog(lead) {
        editingLeadId = lead.id;
        document.getElementById("editLeadFirstName").value =
          lead.firstName || "";
        document.getElementById("editLeadLastName").value = lead.lastName || "";
        document.getElementById("editLeadEmail").value = lead.email || "";
        document.getElementById("editLeadPhone").value = lead.phone || "";
        document.getElementById("editLeadCompany").value = lead.company || "";
        document.getElementById("editLeadCapturedBy").value =
          lead.capturedBy || "";
        document.getElementById("editLeadProducts").value = Array.isArray(
          lead.productsOfInterest,
        )
          ? lead.productsOfInterest.join(", ")
          : "";
        document.getElementById("editLeadNotes").value = lead.notes || "";
        showMessage("editLeadMessage", "", "success");
        editLeadDialog.showModal();
      }

      function closeEditLeadDialog() {
        editingLeadId = null;
        editLeadDialog.close();
      }

      async function saveLeadEdits(submitEvent) {
        submitEvent.preventDefault();
        if (!editingLeadId) {
          return;
        }

        const button = document.getElementById("editLeadSave");
        const defaultLabel = button.textContent;
        button.disabled = true;
        button.textContent = "Saving…";

        try {
          eventData = await updateLead(eventId, editingLeadId, {
            firstName: document.getElementById("editLeadFirstName").value,
            lastName: document.getElementById("editLeadLastName").value,
            email: document.getElementById("editLeadEmail").value,
            phone: document.getElementById("editLeadPhone").value,
            company: document.getElementById("editLeadCompany").value,
            capturedBy: document.getElementById("editLeadCapturedBy").value,
            productsOfInterest:
              document.getElementById("editLeadProducts").value,
            notes: document.getElementById("editLeadNotes").value,
          });
          closeEditLeadDialog();
          renderLeaderboard();
          renderLeads();
        } catch (error) {
          showMessage("editLeadMessage", error.message, "error");
        } finally {
          button.disabled = false;
          button.textContent = defaultLabel;
        }
      }

      async function saveEventEdits(submitEvent) {
        submitEvent.preventDefault();

        const button = document.getElementById("editEventSave");
        const defaultLabel = button.textContent;
        button.disabled = true;
        button.textContent = "Saving…";

        try {
          eventData = await updateEvent(eventId, {
            name: document.getElementById("editEventName").value,
            date: document.getElementById("editEventDate").value,
          });
          eventTitle.textContent = eventData.name;
          breadcrumbCurrent.textContent = eventData.name;
          document.title = `${eventData.name} — JWOC Events Hub`;
          closeEditDialog();
          renderLeads();
        } catch (error) {
          showMessage("editEventMessage", error.message, "error");
        } finally {
          button.disabled = false;
          button.textContent = defaultLabel;
        }
      }

      async function toggleArchive() {
        const nextArchived = !isEventArchived(eventData);
        const defaultLabel = archiveEventButton.textContent;
        archiveEventButton.disabled = true;
        archiveEventButton.textContent = nextArchived
          ? "Archiving…"
          : "Restoring…";

        try {
          eventData = await updateEvent(eventId, { archived: nextArchived });
          updateAdminActions();
        } catch (error) {
          showMessage("pageMessage", error.message, "error");
        } finally {
          archiveEventButton.disabled = false;
          archiveEventButton.textContent = defaultLabel;
          updateAdminActions();
        }
      }

      function renderPaginationControls(pagination) {
        if (pagination.total <= pagination.pageSize) {
          leadsPagination.hidden = true;
          leadsPagination.innerHTML = "";
          return;
        }

        leadsPagination.hidden = false;
        leadsPagination.innerHTML = `
          <button type="button" class="btn btn-ghost btn-small" data-page="prev" ${pagination.page <= 1 ? "disabled" : ""}>
            Previous
          </button>
          <span class="pagination-summary">Page ${pagination.page} of ${pagination.totalPages}</span>
          <button type="button" class="btn btn-ghost btn-small" data-page="next" ${pagination.page >= pagination.totalPages ? "disabled" : ""}>
            Next
          </button>
        `;

        leadsPagination
          .querySelector('[data-page="prev"]')
          ?.addEventListener("click", () => {
            leadsPage = Math.max(1, pagination.page - 1);
            renderLeads();
          });
        leadsPagination
          .querySelector('[data-page="next"]')
          ?.addEventListener("click", () => {
            leadsPage = Math.min(pagination.totalPages, pagination.page + 1);
            renderLeads();
          });
      }

      function renderLeads() {
        if (!eventData) {
          return;
        }

        const allLeads = eventData.leads || [];
        const filters = getLeadFiltersFromForm(leadFilters);
        const filteredLeads = filterLeads(allLeads, filters);
        const duplicateIds = getDuplicateLeadIds(allLeads);
        const hasActiveFilters =
          filters.search ||
          filters.hasPhone ||
          filters.hasEmail ||
          filters.hasCompany ||
          filters.duplicatesOnly;
        const pagination = paginate(filteredLeads, leadsPage);
        const pageLeads = pagination.items;

        const archivedLabel = isEventArchived(eventData) ? " · Archived" : "";
        eventMeta.textContent = `${formatDate(eventData.date)} · ${allLeads.length} leads${archivedLabel}`;
        exportCsvButton.href = buildLeadExportUrl(eventId, filters);

        leadsEmpty.hidden = allLeads.length > 0;
        leadsFilteredEmpty.hidden =
          allLeads.length === 0 ||
          filteredLeads.length > 0 ||
          !hasActiveFilters;
        leadFilters.hidden = allLeads.length === 0;

        if (!allLeads.length) {
          filterSummary.textContent = "";
          leadsTableWrap.innerHTML = "";
          leadsPagination.hidden = true;
          updateBulkActions();
          return;
        }

        const rangeStart = filteredLeads.length
          ? (pagination.page - 1) * pagination.pageSize + 1
          : 0;
        const rangeEnd = Math.min(
          pagination.page * pagination.pageSize,
          filteredLeads.length,
        );

        filterSummary.textContent = hasActiveFilters
          ? `Showing ${rangeStart}–${rangeEnd} of ${filteredLeads.length} filtered (${allLeads.length} total)`
          : filteredLeads.length > pagination.pageSize
            ? `Showing ${rangeStart}–${rangeEnd} of ${allLeads.length}`
            : `${allLeads.length} contacts`;

        if (!filteredLeads.length) {
          leadsTableWrap.innerHTML = "";
          leadsPagination.hidden = true;
          updateBulkActions();
          return;
        }

        const selectHeader = isAdmin
          ? `<th class="select-cell">
              <input
                type="checkbox"
                id="selectAllLeads"
                aria-label="Select all on this page"
              />
            </th>`
          : "";

        const rows = pageLeads
          .map((lead) => {
            const products = Array.isArray(lead.productsOfInterest)
              ? lead.productsOfInterest.join(", ")
              : "";
            const isDuplicate = duplicateIds.has(lead.id);
            const duplicateBadge = isDuplicate
              ? '<span class="duplicate-badge">Duplicate</span>'
              : "";
            const selectCell = isAdmin
              ? `<td class="select-cell">
                  <input
                    type="checkbox"
                    class="lead-select-checkbox"
                    data-lead-checkbox="${escapeHtml(lead.id)}"
                    aria-label="Select ${escapeHtml(lead.firstName || "")} ${escapeHtml(lead.lastName || "")}"
                    ${selectedLeadIds.has(lead.id) ? "checked" : ""}
                  />
                </td>`
              : "";
            const deleteCell = isAdmin
              ? `<td class="actions-cell">
                  <div class="btn-group">
                    <button
                      type="button"
                      class="btn btn-ghost btn-small"
                      data-edit-lead="${escapeHtml(lead.id)}"
                    >
                      Edit
                    </button>
                    <button
                      type="button"
                      class="btn btn-ghost btn-small btn-danger-ghost"
                      data-delete-lead="${escapeHtml(lead.id)}"
                    >
                      Delete
                    </button>
                  </div>
                </td>`
              : "";

            return `
              <tr class="${isDuplicate ? "duplicate-row" : ""}">
                ${selectCell}
                <td>
                  <div class="name-cell">
                    <span>${escapeHtml(lead.firstName || "")} ${escapeHtml(lead.lastName || "")}</span>
                    ${duplicateBadge}
                  </div>
                </td>
                <td>${escapeHtml(lead.email || "—")}</td>
                <td class="hide-mobile">${escapeHtml(lead.phone || "—")}</td>
                <td class="hide-mobile">${escapeHtml(lead.company || "—")}</td>
                <td class="hide-mobile">${escapeHtml(products || "—")}</td>
                <td class="hide-mobile">${escapeHtml(lead.capturedBy || "—")}</td>
                <td>${escapeHtml(formatDateTime(lead.capturedAt))}</td>
                ${deleteCell}
              </tr>
            `;
          })
          .join("");

        const actionsHeader = isAdmin ? "<th></th>" : "";

        leadsTableWrap.innerHTML = `
          <table class="data-table">
            <thead>
              <tr>
                ${selectHeader}
                <th>Name</th>
                <th>Email</th>
                <th class="hide-mobile">Phone</th>
                <th class="hide-mobile">Company</th>
                <th class="hide-mobile">Products</th>
                <th class="hide-mobile">Captured by</th>
                <th>Captured</th>
                ${actionsHeader}
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        `;

        if (isAdmin) {
          const selectAll = document.getElementById("selectAllLeads");
          if (selectAll) {
            selectAll.addEventListener("change", () => {
              pageLeads.forEach((lead) => {
                if (selectAll.checked) {
                  selectedLeadIds.add(lead.id);
                } else {
                  selectedLeadIds.delete(lead.id);
                }
              });
              leadsTableWrap
                .querySelectorAll("[data-lead-checkbox]")
                .forEach((checkbox) => {
                  checkbox.checked = selectAll.checked;
                });
              updateBulkActions();
            });
            updateSelectAllCheckbox();
          }

          leadsTableWrap
            .querySelectorAll("[data-lead-checkbox]")
            .forEach((checkbox) => {
              checkbox.addEventListener("change", () => {
                const leadId = checkbox.getAttribute("data-lead-checkbox");
                if (checkbox.checked) {
                  selectedLeadIds.add(leadId);
                } else {
                  selectedLeadIds.delete(leadId);
                }
                updateBulkActions();
                updateSelectAllCheckbox();
              });
            });

          leadsTableWrap
            .querySelectorAll("[data-edit-lead]")
            .forEach((button) => {
              button.addEventListener("click", () => {
                const leadId = button.getAttribute("data-edit-lead");
                const lead = allLeads.find((item) => item.id === leadId);
                if (lead) {
                  openEditLeadDialog(lead);
                }
              });
            });

          leadsTableWrap
            .querySelectorAll("[data-delete-lead]")
            .forEach((button) => {
              button.addEventListener("click", () => {
                const leadId = button.getAttribute("data-delete-lead");
                const lead = allLeads.find((item) => item.id === leadId);
                const leadName = lead
                  ? `${lead.firstName || ""} ${lead.lastName || ""}`.trim()
                  : "this contact";
                confirmDeleteLead(leadId, leadName);
              });
            });
        }

        updateBulkActions();
        renderPaginationControls(pagination);
      }

      function updateBulkActions() {
        if (!isAdmin || !eventData || !(eventData.leads || []).length) {
          leadsBulkActions.hidden = true;
          return;
        }

        leadsBulkActions.hidden = false;
        const count = selectedLeadIds.size;
        leadsSelectionSummary.textContent =
          count === 1 ? "1 selected" : `${count} selected`;
        deleteSelectedLeadsButton.disabled = count === 0;
      }

      function updateSelectAllCheckbox() {
        const selectAll = document.getElementById("selectAllLeads");
        if (!selectAll) {
          return;
        }

        const checkboxes = leadsTableWrap.querySelectorAll(
          "[data-lead-checkbox]",
        );
        const checkedCount = [...checkboxes].filter(
          (checkbox) => checkbox.checked,
        ).length;
        selectAll.checked =
          checkboxes.length > 0 && checkedCount === checkboxes.length;
        selectAll.indeterminate =
          checkedCount > 0 && checkedCount < checkboxes.length;
      }

      async function confirmDeleteSelectedLeads() {
        const count = selectedLeadIds.size;
        if (!count) {
          return;
        }

        const confirmed = window.confirm(
          `Delete ${count} contact${count === 1 ? "" : "s"}? This cannot be undone.`,
        );
        if (!confirmed) {
          return;
        }

        showMessage("pageMessage", "", "success");

        const defaultLabel = deleteSelectedLeadsButton.textContent;
        deleteSelectedLeadsButton.disabled = true;
        deleteSelectedLeadsButton.textContent = "Deleting…";

        try {
          const leadIds = [...selectedLeadIds];
          eventData = await deleteLeads(eventId, leadIds);
          selectedLeadIds.clear();
          const filters = getLeadFiltersFromForm(leadFilters);
          const filteredLeads = filterLeads(eventData.leads || [], filters);
          const pagination = paginate(filteredLeads, leadsPage);
          if (
            pagination.page > pagination.totalPages &&
            pagination.totalPages > 0
          ) {
            leadsPage = pagination.totalPages;
          }
          renderLeaderboard();
          renderLeads();
        } catch (error) {
          showMessage("pageMessage", error.message, "error");
          updateBulkActions();
        } finally {
          deleteSelectedLeadsButton.textContent = defaultLabel;
        }
      }

      async function confirmDeleteLead(leadId, leadName) {
        const confirmed = window.confirm(
          `Delete ${leadName}? This cannot be undone.`,
        );
        if (!confirmed) {
          return;
        }

        showMessage("pageMessage", "", "success");

        try {
          eventData = await deleteLead(eventId, leadId);
          selectedLeadIds.delete(leadId);
          const filters = getLeadFiltersFromForm(leadFilters);
          const filteredLeads = filterLeads(eventData.leads || [], filters);
          const pagination = paginate(filteredLeads, leadsPage);
          if (
            pagination.page > pagination.totalPages &&
            pagination.totalPages > 0
          ) {
            leadsPage = pagination.totalPages;
          }
          renderLeaderboard();
          renderLeads();
        } catch (error) {
          showMessage("pageMessage", error.message, "error");
        }
      }

      function exportFilteredJson() {
        if (!eventData) {
          return;
        }

        const filters = getLeadFiltersFromForm(leadFilters);
        const filteredLeads = filterLeads(eventData.leads || [], filters);
        const exportPayload = {
          ...eventData,
          leads: filteredLeads,
          exportedWithFilters: filters,
        };
        const blob = new Blob([JSON.stringify(exportPayload, null, 2)], {
          type: "application/json",
        });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `${eventData.id}-leads.json`;
        link.click();
        URL.revokeObjectURL(url);
      }
    </script>
  </body>
</html>
