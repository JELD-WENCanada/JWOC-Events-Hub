<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Leads — JWOC Events Hub</title>
    <link rel="stylesheet" href="/css/style.css?v=3" />
  </head>
  <body>
    <header class="app-header">
      <div class="app-header-inner">
        <div class="app-header-brand">
          <img
            src="/images/jw-logo.png"
            alt=""
            class="app-header-logo"
            width="36"
            height="36"
          />
          <h1 class="nav-title">Events Hub</h1>
        </div>
        <a href="/" class="btn btn-text">← Events</a>
      </div>
    </header>

    <main class="app-content">
      <section class="card">
        <div class="detail-head">
          <div>
            <h1 id="eventTitle">Event</h1>
            <p id="eventMeta" class="subtitle"></p>
          </div>
          <div class="actions">
            <a id="exportCsvButton" class="btn btn-secondary" href="#"
              >Export CSV</a
            >
            <button
              type="button"
              id="exportJsonButton"
              class="btn btn-secondary"
            >
              JSON
            </button>
          </div>
        </div>

        <div id="leadsTableWrap" class="table-wrap"></div>
        <div id="leadsEmpty" class="empty-state" style="display: none">
          No leads captured yet for this event.
        </div>
        <div id="pageMessage" class="message error" style="display: none"></div>
      </section>
    </main>

    <script src="/js/app.js?v=3"></script>
    <script>
      const params = new URLSearchParams(window.location.search);
      const eventId = params.get("id");

      const eventTitle = document.getElementById("eventTitle");
      const eventMeta = document.getElementById("eventMeta");
      const leadsTableWrap = document.getElementById("leadsTableWrap");
      const leadsEmpty = document.getElementById("leadsEmpty");
      const exportCsvButton = document.getElementById("exportCsvButton");
      const exportJsonButton = document.getElementById("exportJsonButton");

      if (!eventId) {
        showMessage("pageMessage", "Missing event ID in URL.", "error");
      } else {
        exportCsvButton.href = `/api/events/${encodeURIComponent(eventId)}/export`;
        loadEvent();
      }

      async function loadEvent() {
        try {
          const event = await apiRequest(
            `/api/events/${encodeURIComponent(eventId)}`,
          );

          eventTitle.textContent = event.name;
          eventMeta.textContent = `${formatDate(event.date)} · ${(event.leads || []).length} leads captured`;

          const leads = event.leads || [];
          leadsEmpty.style.display = leads.length ? "none" : "block";

          if (!leads.length) {
            leadsTableWrap.innerHTML = "";
            return;
          }

          const rows = leads
            .map((lead) => {
              const products = Array.isArray(lead.productsOfInterest)
                ? lead.productsOfInterest.join(", ")
                : "";
              return `
                <tr>
                  <td>${escapeHtml(lead.firstName || "")} ${escapeHtml(lead.lastName || "")}</td>
                  <td>${escapeHtml(lead.email || "")}</td>
                  <td class="hide-mobile">${escapeHtml(lead.phone || "")}</td>
                  <td class="hide-mobile">${escapeHtml(lead.company || "")}</td>
                  <td class="hide-mobile">${escapeHtml(products)}</td>
                  <td class="hide-mobile">${escapeHtml(lead.capturedBy || "")}</td>
                  <td>${escapeHtml(formatDateTime(lead.capturedAt))}</td>
                </tr>
              `;
            })
            .join("");

          leadsTableWrap.innerHTML = `
            <table class="data-table">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Email</th>
                  <th class="hide-mobile">Phone</th>
                  <th class="hide-mobile">Company</th>
                  <th class="hide-mobile">Products</th>
                  <th class="hide-mobile">Captured by</th>
                  <th>Captured</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          `;

          exportJsonButton.addEventListener("click", () => {
            const blob = new Blob([JSON.stringify(event, null, 2)], {
              type: "application/json",
            });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = `${event.id}.json`;
            link.click();
            URL.revokeObjectURL(url);
          });
        } catch (error) {
          showMessage("pageMessage", error.message, "error");
        }
      }
    </script>
  </body>
</html>
